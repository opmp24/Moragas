[build]
  command = "npm run build"
  publish = "dist"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@google/generative-ai", "@supabase/supabase-js"]

[dev]
  framework = "vite"
  targetPort = 5173
  functionsPort = 8889
  publish = "dist"
  autoLaunch = true
